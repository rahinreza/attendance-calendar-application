<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#gradient1)" stroke="#2196F3" stroke-width="2"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1929;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Calendar Icon -->
  <rect x="28" y="28" width="64" height="64" rx="6" fill="url(#gradient2)" stroke="#64b5f6" stroke-width="2"/>
  
  <!-- Calendar Header -->
  <rect x="28" y="28" width="64" height="16" rx="6" fill="#1565c0"/>
  <rect x="28" y="36" width="64" height="8" fill="#1565c0"/>
  
  <!-- Calendar Binding Rings -->
  <circle cx="42" cy="30" r="3" fill="#e3f2fd"/>
  <circle cx="60" cy="30" r="3" fill="#e3f2fd"/>
  <circle cx="78" cy="30" r="3" fill="#e3f2fd"/>
  
  <!-- Calendar Grid -->
  <line x1="36" y1="52" x2="84" y2="52" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="36" y1="60" x2="84" y2="60" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="36" y1="68" x2="84" y2="68" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="36" y1="76" x2="84" y2="76" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="36" y1="84" x2="84" y2="84" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  
  <line x1="44" y1="44" x2="44" y2="88" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="52" y1="44" x2="52" y2="88" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="44" x2="60" y2="88" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="68" y1="44" x2="68" y2="88" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  <line x1="76" y1="44" x2="76" y2="88" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
  
  <!-- Checkmarks (Present Days) -->
  <path d="M 38 56 L 41 59 L 46 54" stroke="url(#gradient3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 54 64 L 57 67 L 62 62" stroke="url(#gradient3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 70 72 L 73 75 L 78 70" stroke="url(#gradient3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 46 80 L 49 83 L 54 78" stroke="url(#gradient3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Highlight Circle (Today) -->
  <circle cx="64" cy="80" r="5" fill="#10b981" opacity="0.3"/>
  <circle cx="64" cy="80" r="3" fill="#10b981"/>
</svg>
