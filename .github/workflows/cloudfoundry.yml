name: deploy-cloudfoundry

on:
  push:
    branches:
      - main
jobs:
  deploy-as:
    runs-on: [comcast-ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf-cli

      - name: Check Cloud Foundry Version
        run: |
          cf version
      - name: Login to Cloud Foundry
        run: |
          cf login -a https://api.asd-d1.cf.comcast.net -u "${{ secrets.USERNAME }}" -p "${{ secrets.PASSWORD }}" -o "${{ secrets.ORG }}" -s default
        continue-on-error: true
      - name: Push application to Cloud Foundry
        run: |
          cf push csse-attendance -b https://buildpacks.apa.comcast.net/nodejs#canary
        continue-on-error: true
      - name: Display application routes
        run: |
          cf app csse-attendance
